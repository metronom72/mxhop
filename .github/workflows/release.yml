name: Release

# A version tag is the trigger: nothing is published from a branch, so a
# merge cannot ship an image by accident.
on:
  push:
    tags: ["v*"]

# Every job runs on GitHub-hosted runners. This repository is public, so they
# are free and unmetered; there is no self-hosted runner to keep alive.
permissions:
  contents: read

jobs:
  binary:
    name: Static binary
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the binary to the release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (musl)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/mxhop
      # Name the asset after the tag and the target, so a download that has
      # lost its page still says which build it is.
      - name: Name the asset
        run: |
          install -D target/x86_64-unknown-linux-musl/release/mxhop \
            "dist/mxhop-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag may be pushed before the release exists; create it then.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  image:
    name: Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN is the only credential this repo has
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/metronom72/mxhop
          # v1.2.3 publishes 1.2.3, 1.2 and 1 — so a stack file can pin as
          # loosely or as tightly as its operator wants. No `latest`: a mail
          # server that updates itself on a tag nobody chose is not wanted.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # the only target the build is proved on
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
