services:
  mxhop:
    image: ghcr.io/metronom72/mxhop:0.3.2
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    ports:
      - "25:2525"
    volumes:
      - type: bind
        source: ./spool
        target: /var/lib/mxhop/spool
      - type: bind
        source: ./config
        target: /etc/mxhop
        read_only: true
    healthcheck:
      test: ["CMD", "/mxhop", "health"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
