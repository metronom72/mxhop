version: "3.8"

services:
  mxhop:
    image: ghcr.io/metronom72/mxhop:0.3.2

    ports:
      - target: 2525
        published: 25
        protocol: tcp
        mode: host

    volumes:
      - type: bind
        source: /srv/mxhop/spool
        target: /var/lib/mxhop/spool

      - type: bind
        source: /srv/mxhop
        target: /etc/mxhop
        read_only: true

    secrets:
      - mxhop_srs_secret

    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

    init: true

    stop_grace_period: 30s

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "/mxhop", "health"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  mxhop_srs_secret:
    external: true
