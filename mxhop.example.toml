# mxhop, by example. Copy this to /etc/mxhop/mxhop.toml and edit it.
#
# Check it before restarting anything:
#
#     mxhop check --config /etc/mxhop/mxhop.toml
#
# `check` reports every problem it can find with its line, and exits non-zero,
# so a deploy pipeline can gate on it.

# The name mxhop announces in HELO. It must be a name the world can resolve,
# and its reverse DNS (PTR) should point back at it — receivers check.
hostname = "mx.example.com"

# Where the SMTP listener binds. Port 25 is privileged: give the binary
# CAP_NET_BIND_SERVICE, or hand it a socket, rather than running it as root.
listen = "0.0.0.0:25"

# The queue. One file per message, so `ls` and `cat` are the admin interface.
# Must be absolute: a relative path would follow the working directory, and a
# queue that moves is a queue that loses mail.
spool_dir = "/var/lib/mxhop/spool"

# The largest message mxhop will accept, in bytes. Default is 25 MiB, which is
# Gmail's ceiling. Accepting more than the destination takes means accepting
# responsibility for mail you then cannot hand over.
max_message_bytes = 26214400

# One table per domain you accept mail for. Mail for a domain that is not
# listed here is refused outright — a TXT record somewhere else cannot make
# mxhop accept mail on your behalf.
[domains."example.com".aliases]

# The ordinary case: one alias, one destination.
hi = "me@gmail.com"

# Several destinations: every one of them gets a copy.
team = ["me@gmail.com", "colleague@fastmail.com"]

# Everything not named above. Leave it out if you would rather unknown
# addresses be refused at the door — which is kinder to the sender, and keeps
# your real mailbox out of reach of address harvesters.
"*" = "catchall@gmail.com"

# An address that exists on purpose and takes no mail. The reply has to begin
# with an SMTP status code, because that is what the sender's server receives.
noreply = { reject = "550 5.1.1 this address does not accept mail" }

# A second domain looks the same.
[domains."example.org".aliases]
"*" = "me@gmail.com"
