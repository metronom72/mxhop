# mxhop, by example. Copy this to /etc/mxhop/mxhop.toml and edit it.
#
# Check it before restarting anything:
#
#     mxhop check --config /etc/mxhop/mxhop.toml
#
# `check` reports every problem it can find with its line, and exits non-zero,
# so a deploy pipeline can gate on it.

# The name mxhop announces in HELO. It must be a name the world can resolve,
# and its reverse DNS (PTR) should point back at it — receivers check.
hostname = "mx.example.com"

# Where the SMTP listener binds. Port 25 is privileged: give the binary
# CAP_NET_BIND_SERVICE, or hand it a socket, rather than running it as root.
listen = "0.0.0.0:25"

# The queue. One file per message, so `ls` and `cat` are the admin interface.
# Must be absolute: a relative path would follow the working directory, and a
# queue that moves is a queue that loses mail.
spool_dir = "/var/lib/mxhop/spool"

# The largest message mxhop will accept, in bytes. Default is 25 MiB, which is
# Gmail's ceiling. Accepting more than the destination takes means accepting
# responsibility for mail you then cannot hand over.
max_message_bytes = 26214400

# Opportunistic inbound STARTTLS. Leave the whole table out and mxhop speaks
# plaintext only, which is a supported way to run an MX.
#
# TLS here is never required: this is a receiving MX, not a submission server,
# and a sender that offers no encryption still has to be able to deliver.
# Refusing plaintext would lose mail.
#
# mxhop does not get certificates — it reads the files Caddy or certbot
# renews. Both paths must be absolute: they are read again on SIGHUP, from
# whatever directory the service is in by then.
#
#     systemctl reload mxhop      # or: kill -HUP $(pidof mxhop)
#
# `systemctl reload` only works if the unit has an ExecReload line:
#
#     ExecReload=/bin/kill -HUP $MAINPID
#
# Without it systemd refuses with "job type reload is not applicable", and the
# renewed certificate sits on disk unread until the next restart.
#
# A reload that cannot read the files logs a warning and keeps serving the
# certificate it already has. Startup is the opposite: a [tls] block whose
# files are unreadable stops the service, because starting plaintext-only
# would downgrade every sender silently.
#
# [tls]
# certificate = "/var/lib/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mx.example.com/mx.example.com.crt"
# key = "/var/lib/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mx.example.com/mx.example.com.key"

# How mxhop hands mail on. The whole table is optional.
[outbound]

# Deliver over IPv6 to a destination that also publishes an A record. Off by
# default, and worth leaving off unless your IPv6 reverse DNS (PTR) resolves
# to this host's name: Gmail answers an IPv6 sender whose PTR does not match
# with "550-5.7.25", and does it for every message. A destination that
# publishes only AAAA records is tried over IPv6 either way.
ipv6 = false

# One table per domain you accept mail for. Mail for a domain that is not
# listed here is refused outright — a TXT record somewhere else cannot make
# mxhop accept mail on your behalf.
[domains."example.com".aliases]

# The ordinary case: one alias, one destination.
hi = "me@gmail.com"

# Several destinations: every one of them gets a copy.
team = ["me@gmail.com", "colleague@fastmail.com"]

# Everything not named above. Leave it out if you would rather unknown
# addresses be refused at the door — which is kinder to the sender, and keeps
# your real mailbox out of reach of address harvesters.
"*" = "catchall@gmail.com"

# An address that exists on purpose and takes no mail. The reply has to begin
# with an SMTP status code, because that is what the sender's server receives.
noreply = { reject = "550 5.1.1 this address does not accept mail" }

# A second domain looks the same.
[domains."example.org".aliases]
"*" = "me@gmail.com"

# Sender rewriting (SRS). Without this table forwarded mail keeps the original
# sender in its envelope, the destination checks SPF against a domain whose
# record does not name this server, and the check fails — Gmail junks mail that
# shape. Worse, any bounce the destination issues after accepting goes to that
# original sender, who never wrote to you.
#
# The domain must have an MX record pointing at this host and an SPF record
# naming its address, and it must NOT appear in [domains] above: the alias
# table is consulted first, so a domain in both would have its bounces
# answered by an alias lookup instead of being decoded. `mxhop check` refuses
# that configuration.
#
#     srs.example.com.   MX   10 mx.example.com.
#     srs.example.com.   TXT  "v=spf1 ip4:203.0.113.10 -all"
#
# With `outbound.ipv6 = true` that record needs an `ip6:` term as well, or
# every message delivered over IPv6 hard-fails SPF at the destination.
#
# The signing key is never in this file. Generate it on the server:
#
#     head -c 32 /dev/urandom | base64 > /etc/mxhop/srs.key
#     chmod 600 /etc/mxhop/srs.key
#
# To rotate it, put the new key on the first line and keep the old one below
# it for at least max_age_days: the first line signs and every line verifies,
# so bounces already in flight still come home.
#
# [srs]
# domain = "srs.example.com"
# secret_file = "/etc/mxhop/srs.key"

# How many days a rewritten address stays valid. 7 is the default — not
# postsrsd's 21. A legitimate delivery report arrives inside the reporting
# server's queue lifetime, which is about five days, so a week covers the
# reports that are actually coming, and the fortnight after it is mostly a
# window in which an address harvested out of a `Received` header can be
# replayed through this host. Raise it if you would rather catch a very late
# out-of-office reply than keep the replay window short. At most 365: the day
# an address carries wraps every 1024 days, so a larger number switches
# expiry off instead of widening it, and `mxhop check` refuses it.
# max_age_days = 7

# What arriving mail is checked for: SPF, DKIM and DMARC, once, at the end of
# DATA — before anything leaves, while the sending server still holds the
# message. What was found is written into an `Authentication-Results` header
# directly under mxhop's own `Received`; nothing else in the message changes.
#
# The whole table is optional, and leaving it out is the same as what is
# written below. The default is on, and enforcing, because the only thing it
# ever refuses is mail whose own domain asked every receiver to refuse it:
#
#     DMARC fails and the domain publishes p=reject   -> 550 5.7.1
#     p=reject in hand, the check could not finish    -> 451 4.7.1, try again
#     the check could not be done at all, no policy   -> forwarded, dmarc=temperror
#     DMARC fails under p=quarantine                  -> forwarded, header says so
#     DMARC fails under p=none, or there is no record  -> forwarded
#     anything else, SPF failures included            -> forwarded
#
# Defer only where a definite answer could have refused. Nothing here is
# silent: every refusal names the domain and the policy, in a sentence the
# sending server reads.
#
# The third line is deliberate and there is no setting for it. An unreadable
# policy could have been p=reject, but "no policy" is not produced only by a
# broken `_dmarc` at the sender: mail-auth abandons the whole DMARC tree walk
# on the first non-NXDOMAIN failure at any level, so a REFUSED answer, a
# flaky authoritative server or a DNSSEC-bogus zone anywhere in a domain's
# `_dmarc` ancestry arrives as "no policy" — and so does mxhop's own expired
# DNS budget, which one dead `include:` in an ordinary sender's SPF record
# can spend. A retry gets the same answer, so deferring there is a bounce
# after the sender's retry window, over DNS that never affected delivery
# before. The forgery it would have caught needs that domain's *own* `_dmarc`
# to be unanswerable, which a forger does not control, and the destination
# re-evaluates DMARC with its own resolver anyway.
#
# This matters more for a forwarder than for an ordinary MX. After SRS every
# message mxhop forwards passes SPF at the destination, so without this check
# a forged `From: service@paypal.com` reaches Gmail with a clean envelope and
# this host's address on it — and Gmail's refusal is counted against this
# host, every time.
#
# [auth]
#
# false switches the whole thing off: no lookups, no header, no refusals, and
# the message's bytes leave exactly as they arrived. Use it if something in
# front of mxhop already does this and writes the header — including when that
# box signs its header with this host's name, which is the natural thing for
# the same operator to configure. With the check on, a header already in the
# message under *this host's* name is deleted before ours is written (RFC 8601
# §5 requires it: otherwise a sender writes our finding for us). With the
# check off mxhop has no finding, so it deletes nothing.
# enabled = true
#
# "off" evaluates everything and writes the header, and never refuses or
# defers — but it logs, at info, the code it would have sent together with the
# domain and the policy. That is the setting for watching what enforcement
# *would* do for a week before turning it on, and without that log line the
# week would be blind: the only other trace is the header, in a mailbox at the
# destination. `mxhop check` refuses `enforce` together with
# `enabled = false`: with no lookups there is no result to enforce, and the
# pair reads like a setting without being one.
# enforce = "dmarc"
